services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD:-Strong!Passw0rd}
    ports:
      - "1436:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - voyager-vsa-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 30s
      timeout: 30s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init-db.sql:/init-db.sql
    command: /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P Strong!Passw0rd -i /init-db.sql
    networks:
      - voyager-vsa-network

  redis:
    image: redis:latest
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 20 1 --loglevel warning
    networks:
      - voyager-vsa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 30s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-Strong!Passw0rd}
    ports:
      - "5675:5672"
      - "15675:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - voyager-vsa-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 10

  identity-api:
    build:
      context: ..
      dockerfile: Vertical.Slice.Architecture/Identity/Identity.Api/Dockerfile
    environment:
      - ConnectionStrings__IdentityContext=Server=tcp:sqlserver,1433;Initial Catalog=identity;Persist Security Info=False;User ID=sa;Password=${DB_SA_PASSWORD:-Strong!Passw0rd};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-Strong!Passw0rd}
      - Identity__Issuer=http://identity-api:8080
      # Demo stack only: lets Identity fall back to OpenIddict's development signing/encryption
      # certificates. Without it the service refuses to start outside Development rather than
      # silently issuing tokens signed with a per-machine ephemeral key.
      - Identity__UseDevelopmentCertificates=true
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5301:8080"
    networks:
      - voyager-vsa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  driver-api:
    build:
      context: ..
      dockerfile: Vertical.Slice.Architecture/Driver/Driver.Api/Dockerfile
    environment:
      - ConnectionStrings__DriverContext=Server=tcp:sqlserver,1433;Initial Catalog=driver;Persist Security Info=False;User ID=sa;Password=${DB_SA_PASSWORD:-Strong!Passw0rd};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-Strong!Passw0rd}
      - Redis__ConnectionString=redis:6379
      - Identity__Issuer=http://identity-api:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    ports:
      - "5302:8080"
    networks:
      - voyager-vsa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ride-api:
    build:
      context: ..
      dockerfile: Vertical.Slice.Architecture/Ride/Ride.Api/Dockerfile
    environment:
      - ConnectionStrings__RideContext=Server=tcp:sqlserver,1433;Initial Catalog=ride;Persist Security Info=False;User ID=sa;Password=${DB_SA_PASSWORD:-Strong!Passw0rd};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-Strong!Passw0rd}
      - Identity__Issuer=http://identity-api:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    ports:
      - "5303:8080"
    networks:
      - voyager-vsa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  hub-api:
    build:
      context: ..
      dockerfile: Vertical.Slice.Architecture/Hub/Hub.Api/Dockerfile
    environment:
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-Strong!Passw0rd}
      - Identity__Issuer=http://identity-api:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    ports:
      - "5300:8080"
    networks:
      - voyager-vsa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:

networks:
  voyager-vsa-network:
    driver: bridge
